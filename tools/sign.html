<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIngram Admin Signer</title>
<style>
  :root { --bg: #fafaf9; --fg: #1c1917; --muted: #57534e; --line: #d6d3d1; --accent: #1d4ed8; --bad: #b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --line: #44403c; --accent: #93c5fd; --bad: #fca5a5; }
  }
  body { background: var(--bg); color: var(--fg); font: 15px/1.5 system-ui, sans-serif; margin: 0; padding: 24px 16px; }
  main { max-width: 760px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 16px; }
  textarea, pre { width: 100%; box-sizing: border-box; font: 13px/1.45 ui-monospace, monospace;
                  background: transparent; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; }
  textarea { min-height: 150px; resize: vertical; }
  pre { white-space: pre-wrap; word-break: break-all; min-height: 1.5em; }
  button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid var(--line);
           background: transparent; color: var(--fg); cursor: pointer; margin: 12px 8px 12px 0; }
  button.primary { border-color: var(--accent); color: var(--accent); }
  .err { color: var(--bad); }
  label { font-weight: 600; display: block; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1>AIngram admin signer</h1>
  <p>Paste the message the admin CLI printed (the text, or the 0x hex line). Your wallet shows the exact
     text before you sign. Nothing leaves this page except the signature you copy back.</p>

  <label for="msg">Message</label>
  <textarea id="msg" spellcheck="false" placeholder="AIngram admin command&#10;Server: ...&#10;Action: ..."></textarea>

  <button id="connect">Connect wallet</button>
  <button id="sign" class="primary">Sign message</button>
  <div id="who"></div>

  <label>Will be signed exactly as</label>
  <pre id="preview"></pre>

  <label>Signature</label>
  <pre id="sig"></pre>
  <button id="copy">Copy signature</button>
  <div id="status"></div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let account = null;

  function decodeHex(hex) {
    const bytes = new Uint8Array(hex.slice(2).match(/../g).map((b) => parseInt(b, 16)));
    return new TextDecoder("utf-8", { fatal: true }).decode(bytes);
  }

  function message() {
    let text = $("msg").value.replace(/\r\n?/g, "\n").trim();
    if (/^0x([0-9a-fA-F]{2})+$/.test(text)) text = decodeHex(text);
    // Terminals can add trailing spaces when copying; the CLI never prints any.
    return text.split("\n").map((l) => l.replace(/\s+$/, "")).join("\n");
  }

  function toHex(text) {
    return "0x" + Array.from(new TextEncoder().encode(text), (b) => b.toString(16).padStart(2, "0")).join("");
  }

  function status(text, bad) {
    $("status").textContent = text;
    $("status").className = bad ? "err" : "";
  }

  $("msg").addEventListener("input", () => {
    try { $("preview").textContent = message(); status(""); }
    catch (e) { status("That hex is not valid UTF-8.", true); }
  });

  $("connect").addEventListener("click", async () => {
    if (!window.ethereum) { status("No wallet found. Open this page in a browser with your wallet extension.", true); return; }
    try {
      [account] = await window.ethereum.request({ method: "eth_requestAccounts" });
      $("who").textContent = "Signing as " + account;
    } catch (e) { status(e.message || String(e), true); }
  });

  $("sign").addEventListener("click", async () => {
    let text;
    try { text = message(); } catch (e) { status("That hex is not valid UTF-8.", true); return; }
    if (!text.startsWith("AIngram admin command\n")) { status("This is not an AIngram admin command.", true); return; }
    if (!account) { $("connect").click(); return; }
    try {
      const sig = await window.ethereum.request({ method: "personal_sign", params: [toHex(text), account] });
      $("sig").textContent = sig;
      status("Signed. Copy the signature back into the admin CLI.");
    } catch (e) { status(e.message || String(e), true); }
  });

  $("copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText($("sig").textContent); status("Copied."); }
    catch (e) { status("Copy failed; select the signature and copy it by hand.", true); }
  });
</script>
</body>
</html>
