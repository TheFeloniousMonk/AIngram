# AIngram policy. Copy to policy.yaml (or point AINGRAM_POLICY at your copy)
# and edit it for your deployment. Keep your real policy under version control
# somewhere you control: changing what a voice may do should be a reviewable,
# revertible commit, never something a tool call can do.
#
# Read at server startup; the server refuses to start on an invalid file.
# The core enforces integrity; this file decides permission.
#
# Subjects are path-like. A pattern ending in /** matches the prefix and
# everything below it. Matching is on the NFC-normalised subject.
#
# Deployment-specific values (the admin wallet address, the server name used
# in signed admin commands) are not set here: they come from the environment.
# See .env.example.

voices:
  brain:
    may_write_kinds: "*"
    may_write_subjects: ["**"]
    may_read_subjects: ["**"]
    may_pin: true
    may_redact: own          # entries written by the brain voice
    daily_write_cap: 300

  code:
    may_write_kinds: [decision, shipped, gotcha]
    may_write_subjects: ["project-a/**", "project-b/**", "aingram/**"]
    # Narrow this to keep a leaked code key from reading the brain's private memory.
    may_read_subjects: ["**"]
    may_pin: false
    may_redact: none
    daily_write_cap: 60

  admin:
    # Reachable only from the admin CLI on the server, never over MCP, and
    # every action must be signed by the admin wallet. Shell access alone is
    # not admin.
    may_write_kinds: [redaction]
    may_write_subjects: ["_redactions"]
    may_read_subjects: ["**"]
    may_pin: false
    may_redact: any
    daily_write_cap: null

admin:
  command_ttl_seconds: 600

# Subjects only the brain may write, whatever any other rule says.
# This is the "only the brain writes the self" line.
brain_only_subjects: ["self/**", "people/**", "ways-of-working/**", "identity/**"]

# Reserved: written by the core itself, never directly by a voice.
reserved_subjects: ["_redactions/**"]
reserved_kinds: [redaction]

decay:
  # Initial half-life by kind, in days. Pinned entries never decay.
  half_life_days:
    breadcrumb: 30
    default: 180
  reinforce_multiplier: 1.5
  half_life_cap_days: 730
  # Only deliberate use reinforces. Appearing in boot or recall does not.
  reinforced_by: [read, cited_in_refs]

boot:
  recent_tail: 8
  token_budget: 1500
  code_digest: one_line
  # "1 entry redacted since you last woke": the brain learns that something
  # was forgotten, never what. Shown whenever a tombstone is newer than last boot.
  redaction_notice: true

limits:
  body_max_chars: 200000
  keywords_max: 32
  keyword_max_chars: 64
  refs_max: 32
  recall_max: 50
